name: Update Blox Fruits Stock

on:
  schedule:
    - cron: "5 */2 * * *"   # every 2 hours, 5 min after each reset
  workflow_dispatch:          # lets you also click "Run workflow" manually to test

permissions:
  contents: write

jobs:
  update-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the small libraries the robot needs
        run: npm install

      - name: Run the robot (scrape current stock)
        run: node scrape.js

      - name: Save the updated stock.json back to GitHub
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add stock.json
          git diff --quiet --cached || git commit -m "Update stock data"
          git push
